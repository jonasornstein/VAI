# Install to /etc/nginx/sites-available/vai and symlink sites-enabled.
# Replace SERVER_NAME with your domain or server IP.

server {
    listen 80;
    server_name SERVER_NAME;

    client_max_body_size 1m;

    # /vai-stats.html and /activity.jsonl are served by the VAI app from the
    # git-deployed tree (see server.py). Do not alias them here — that caused
    # stale HTML when disk/nginx and the running app drifted.

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}